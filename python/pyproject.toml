[project]
name = "freewill"
version = "0.1.0"
description = "FREE WILL simulation engine — tensor-native agent-based simulation (see docs/FREE_WILL_PRD.md)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "sparse>=0.15",           # pydata/sparse — N-dimensional sparse arrays for the trust tensor (PRD 4.1)
    "pandas>=2.2",
    "pyarrow>=15.0",          # Parquet read/write for checkpoint coefficient tables (PRD 6.2)
    "google-cloud-storage>=2.16",
    "cloud-sql-python-connector[psycopg]>=1.12",
    "google-cloud-logging>=3.10",
    "redis>=5.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",          # run config schema (PRD Section 5 / Section 11)
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ui = [
    "dash>=2.17",
    "dash-bootstrap-components>=1.6",
    "plotly>=5.22",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["freewill*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
