name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python (freewill engine)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,ui]"
      - run: ruff check .
      # Split out as its own step (PRD Section 4.4: cross-validate the vectorized
      # mechanism functions against the iterative reference oracle "on every change" to
      # a mechanism module) so a regression here is visible as its own failing step in
      # the Actions UI, not buried inside the general test run below.
      - name: Cross-validate mechanism modules against the iterative reference (PRD 4.4)
        run: pytest -q tests/test_cross_validation.py
      - run: pytest -q

  go:
    name: Go (orchestrator / log shipper)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: gofmt -l . | tee /tmp/gofmt.out && test ! -s /tmp/gofmt.out

  terraform:
    name: Terraform (infra)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -diff
      - run: terraform init -backend=false
      - run: terraform validate

  docker-compose:
    name: Docker Compose (local dev stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d postgres redis gcs-emulator
      - name: Wait for services to be healthy
        run: |
          for svc in postgres redis gcs-emulator; do
            for i in $(seq 1 30); do
              status=$(docker inspect --format='{{.State.Health.Status}}' "$(docker compose ps -q $svc)")
              [ "$status" = "healthy" ] && break
              sleep 2
            done
            [ "$status" = "healthy" ] || { echo "$svc never became healthy"; docker compose logs "$svc"; exit 1; }
          done
      - run: docker compose --profile smoke-test run --rm simulation-smoke-test
      - if: always()
        run: docker compose down -v
